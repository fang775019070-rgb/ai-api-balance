name: Publish download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and package
        run: |
          zsh test.sh
          zsh package.sh
      - name: Publish plugin package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.1.0 \
            dist/AIAPIBalance-v2.1.0.zip dist/AIAPIBalance-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'AI API 余额看板（AI API Balance）v2.1.0' --notes-file RELEASE.md
